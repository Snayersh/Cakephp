services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sterenfix_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:Z
    environment:
      - APP_NAME=${APP_NAME:-Sterenfix - Sistema de Personal}
      - DEBUG=${DEBUG:-true}
      - APP_ENCODING=${APP_ENCODING:-UTF-8}
      - APP_DEFAULT_LOCALE=${APP_DEFAULT_LOCALE:-es_ES}
      - APP_DEFAULT_TIMEZONE=${APP_DEFAULT_TIMEZONE:-America/Mexico_City}
      - SECURITY_SALT=${SECURITY_SALT:-c30d92376e1a0df3311dbb5b991386d38e8ec8e0f6c77bb320c15e8b4e7a68fc}
      - DB_HOST=${DB_HOST:-sterenfix_db}
      - DB_PORT=${DB_PORT:-1521}
      - DB_DATABASE=${DB_DATABASE:-FREEPDB1}
      - DB_USERNAME=${DB_USERNAME:-sterenfix}
      - DB_PASSWORD=${DB_PASSWORD:-SterenfixPassword123#}
      - DB_SCHEMA=${DB_SCHEMA:-STERENFIX}
    depends_on:
      - db
    networks:
      - sterenfix_net

  db:
    image: container-registry.oracle.com/database/free:latest
    container_name: sterenfix_db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-1521}:1521"
    environment:
      - ORACLE_PWD=${DB_PASSWORD:-SterenfixPassword123#}
      - ORACLE_CHARACTERSET=AL32UTF8
    volumes:
      - oracle_data:/opt/oracle/oradata:Z
      - ./database/init.sql:/docker-entrypoint-initdb.d/setup/01_init.sql:Z
      - ./database/schema.sql:/docker-entrypoint-initdb.d/setup/schema.sql:Z
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/setup/seeds.sql:Z
    healthcheck:
      test: ["CMD-SHELL", "/opt/oracle/scripts/base/checkDBStatus.sh || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 40s
    networks:
      - sterenfix_net

networks:
  sterenfix_net:
    driver: bridge

volumes:
  oracle_data:
    driver: local
