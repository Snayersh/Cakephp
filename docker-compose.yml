services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sterenfix_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:Z
    environment:
      - APP_NAME=${APP_NAME:-Sterenfix - Sistema de Personal}
      - DEBUG=${DEBUG:-true}
      - APP_ENCODING=${APP_ENCODING:-UTF-8}
      - APP_DEFAULT_LOCALE=${APP_DEFAULT_LOCALE:-es_ES}
      - APP_DEFAULT_TIMEZONE=${APP_DEFAULT_TIMEZONE:-America/Mexico_City}
      - SECURITY_SALT=${SECURITY_SALT:-c30d92376e1a0df3311dbb5b991386d38e8ec8e0f6c77bb320c15e8b4e7a68fc}
      - DB_DRIVER=${DB_DRIVER:-Cake\Database\Driver\Mysql}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-sterenfix}
      - DB_USERNAME=${DB_USERNAME:-sterenfix}
      - DB_PASSWORD=${DB_PASSWORD:-SterenfixPassword123#}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sterenfix_net

  db:
    image: docker.io/library/mysql:8.0
    container_name: sterenfix_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-SterenfixRootPassword123#}
      - MYSQL_DATABASE=${DB_DATABASE:-sterenfix}
      - MYSQL_USER=${DB_USERNAME:-sterenfix}
      - MYSQL_PASSWORD=${DB_PASSWORD:-SterenfixPassword123#}
    volumes:
      - mysql_data:/var/lib/mysql:Z
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:Z
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/02_seeds.sql:Z
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pSterenfixRootPassword123#"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - sterenfix_net

networks:
  sterenfix_net:
    driver: bridge

volumes:
  mysql_data:
    driver: local
